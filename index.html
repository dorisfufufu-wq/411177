<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doris | 個人網站</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Indie+Flower&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4eee1;       /* 復古紙張色 */
            --text-color: #3e3e3e;     /* 炭筆黑 */
            --accent-color: #5b7065;   /* 植物綠 */
            --ink-blue: #4a6fa5;       /* 鋼筆藍 */
            --secondary-text: #767676; /* 鉛筆灰 */
            --font-main: 'Crimson Text', serif;
            --font-hand: 'Indie Flower', cursive;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 關鍵：讓所有邊框帶有手繪的不規則感 */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            line-height: 1.8;
            /* 模擬紙張紋理 */
            background-image: radial-gradient(#d3cbb8 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 導覽列 - 手繪邊條感 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: fixed;
            width: 94%;
            top: 15px;
            left: 3%;
            background: rgba(244, 238, 225, 0.95);
            border: 2px solid var(--text-color);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .logo {
            font-family: var(--font-hand);
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--ink-blue);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-family: var(--font-hand);
            font-size: 1rem;
            border-bottom: 1px solid transparent;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-color);
            border-bottom: 2px dashed var(--accent-color);
        }

        /* Hero Section */
        .hero-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 80px;
        }

        .hero-content h1 {
            font-family: var(--font-hand);
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .highlight {
            color: var(--accent-color);
            text-decoration: underline wavy var(--ink-blue);
        }

        .tagline {
            font-size: 1.25rem;
            color: var(--secondary-text);
            margin-bottom: 2rem;
            max-width: 600px;
            font-style: italic;
        }

        /* 按鈕樣式 - 手繪印章感 */
        .btn {
            padding: 12px 30px;
            text-decoration: none;
            font-family: var(--font-hand);
            font-weight: 600;
            margin: 0 10px;
            display: inline-block;
            transition: transform 0.2s;
            border: 2px solid var(--text-color);
        }

        .btn:hover {
            transform: scale(1.05) rotate(-1deg);
        }

        .primary {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .secondary {
            background-color: transparent;
            color: var(--text-color);
            border-style: dashed;
        }

        /* Section 通用樣式 */
        section {
            padding: 100px 0;
        }

        .section-title {
            font-family: var(--font-hand);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            color: var(--ink-blue);
        }

        .about-text {
            font-size: 1.2rem;
            color: var(--text-color);
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid #dcd3bc;
        }

        /* Contact Section */
        .contact-links {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .contact-item {
            font-family: var(--font-hand);
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.2rem;
            padding: 5px 10px;
            transition: background 0.3s;
        }

        .contact-item:hover {
            background-color: rgba(91, 112, 101, 0.2);
            color: var(--accent-color);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px;
            font-family: var(--font-hand);
            font-size: 0.9rem;
            color: var(--secondary-text);
            border-top: 1px dashed #dcd3bc;
        }

        @media (max-width: 768px) {
            .hero-content h1 { font-size: 2.5rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">DORIS.</div>
        <ul class="nav-links">
            <li><a href="#hero">首頁</a></li>
            <li><a href="#about">關於我</a></li>
            <li><a href="#contact">聯絡方式</a></li>
        </ul>
    </nav>

    <section id="hero" class="hero-section">
        <div class="hero-content">
            <h1>Doris <span class="highlight">Fu</span></h1>
            <p class="tagline">專注於會計資訊系統與數據分析，致力於用技術優化財務決策。</p>
            <div class="hero-btns">
                <a href="#about" class="btn primary">View Work</a>
                <a href="#contact" class="btn secondary">Contact Me</a>
            </div>
        </div>
    </section>

    <section id="about" class="about-section">
        <div class="container">
            <h2 class="section-title">About Me</h2>
            <p class="about-text">
                你好！我是 Doris。我目前正致力於結合會計專業與資訊系統開發。
                我擅長透過數據分析挖掘潛在問題，並利用程式技術自動化繁瑣的財務流程。
                在追求精確的會計邏輯之餘，我也熱衷於探索新技術。
            </p>
        </div>
    </section>

    <section id="contact" class="contact-section">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <div class="contact-links">
                <a href="mailto:your-email@example.com" class="contact-item">Email</a>
                <a href="https://github.com/" target="_blank" class="contact-item">GitHub</a>
                <a href="https://linkedin.com/" target="_blank" class="contact-item">LinkedIn</a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Doris. Built with Simplicity.</p>
    </footer>

    <script>
        // 平滑捲動
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    window.scrollTo({
                        top: target.offsetTop - 70,
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
</body>
</html>
